spring:
  application:
    name: sparehub-backend
  
  datasource:
    url: jdbc:mysql://localhost:3306/sparehub?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: SpareHubSecretKeyForJWTTokenGeneration2024
  expiration: 86400000 # 24 hours in milliseconds

logging:
  level:
    com.sparehub: DEBUG
    org.springframework.security: DEBUG
