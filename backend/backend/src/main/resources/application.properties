spring.application.name=sparehub-backend

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/sparehub_db1
spring.datasource.username=
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Development staff bootstrap accounts
sparehub.bootstrap.manager-email=
sparehub.bootstrap.manager-password=

sparehub.bootstrap.sales-email=
sparehub.bootstrap.sales-password=

sparehub.bootstrap.inventory-email=
sparehub.bootstrap.inventory-password=

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

sparehub.loyalty.spend-per-point=100
sparehub.loyalty.near-tier-percent=90
